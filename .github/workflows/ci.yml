name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# A newer push to the same branch/PR makes the older run pointless
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ci:
        name: Build, Test & Lint (Node.js ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 15

        strategy:
            fail-fast: false
            matrix:
                # Active LTS lines. Node 20 reached end-of-life in April 2026.
                node-version: [22.x, 24.x]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Enable Corepack
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: yarn

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build packages
              run: |
                  yarn workspace @subzilla/types run build
                  yarn workspace @subzilla/core run build
                  yarn workspace @subzilla/cli run build

            - name: Run type checking
              run: yarn type-check

            - name: Run linting
              run: yarn lint

            - name: Check formatting
              run: yarn format:check

            - name: Run tests with coverage
              run: yarn test:ci

            - name: Upload coverage report
              if: matrix.node-version == '22.x'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: coverage/lcov.info
                  if-no-files-found: error
                  retention-days: 14
