name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: What are you trying to do?
          description: Describe the situation, not only the solution you have in mind.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: What would you like SubZilla to do?
    - type: textarea
      id: sample
      attributes:
          label: Example file (optional)
          description: If this is about a format or markup SubZilla does not handle yet, attach an example.
